# Configuracion comun a todos los servicios que leen del Config Server.
# Sin contrasenas: las credenciales llegan por variables de entorno (Secrets en Kubernetes).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Con server.port=0 el puerto es aleatorio: se registra la IP del pod y un id unico por instancia
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

server:
  # Detras del Gateway: usar los encabezados X-Forwarded-* para armar URLs (ej. Location),
  # asi el cliente ve la direccion del Gateway y no la IP/puerto interno del microservicio
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
