server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/autofix_repair_orders?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

app:
  # Calculo de costo: IVA como fraccion (0.19 = 19%)
  cost:
    tax-rate: ${TAX_RATE:0.19}
