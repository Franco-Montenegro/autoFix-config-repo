server:
  # Puerto aleatorio por defecto (Eureka informa el real). En Kubernetes se fija con SERVER_PORT
  # para que el Service ClusterIP tenga un targetPort (mismo patron del ejemplo del curso).
  port: ${SERVER_PORT:0}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/autofix_repair_orders?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

app:
  # Calculo de costo: IVA como fraccion (0.19 = 19%)
  cost:
    tax-rate: ${TAX_RATE:0.20}
